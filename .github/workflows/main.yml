name: E-commerce CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build Spring Boot backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'ci-only-test-password' }}
          MYSQL_DATABASE: ecommerce
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/ecommerce
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'ci-only-test-password' }}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_APP_JWTSECRET: ${{ secrets.CI_JWT_SECRET || 'ci-only-test-jwt-secret-32-bytes-minimum-1234567890' }}
      SPRING_APP_JWTEXPIRATIONMS: "86400000"
      SPRING_ECOM_APP_JWTCOOKIENAME: "ecommerce-jwt"
      RAZORPAY_KEY_ID: "rzp_test_ci_dummy"
      RAZORPAY_KEY_SECRET: "ci-only-dummy-secret"
      PROJECT_IMAGE: "images/"
      
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test backend
        working-directory: sb-ecom
        run: mvn -B package

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ecom-fronted/package-lock.json

      - name: Install frontend packages
        working-directory: ecom-fronted
        run: npm ci

      - name: Build frontend
        working-directory: ecom-fronted
        env:
          VITE_BACK_END_URL: ${{ vars.VITE_BACK_END_URL }}
        run: npm run build
