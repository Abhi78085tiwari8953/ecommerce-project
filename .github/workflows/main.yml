name: E-commerce CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build Spring Boot backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sb-ecom

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B package

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecom-fronted

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install packages
        run: npm ci

      - name: Build frontend
        run: npm run build
